<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISPC Plot photo backcheck - Kharif 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDF0EA; --panel: #FFFFFF; --ink: #1F2A1E; --muted: #5B6657;
    --line: #CDD5C8; --paddy: #3D6B35; --water: #2B6A88; --warn: #9A4A1F; --soil: #D9DFD4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Public Sans", system-ui, sans-serif; background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.45; }
  [hidden] { display: none !important; }

  header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap;
           padding: .85rem 1.25rem; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 1.05rem; margin: 0; }
  .who { color: var(--muted); font-size: .9rem; }
  .who button { background: none; border: 0; color: var(--water); font: inherit; text-decoration: underline; cursor: pointer; padding: 0; margin-left: .5rem; }
  .bar { height: 4px; background: var(--line); }
  .bar div { height: 100%; background: var(--paddy); width: 0; transition: width .4s; }

  main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr); gap: 1.25rem; padding: 1.25rem; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  .photos { display: grid; grid-template-columns: minmax(0, 640px); gap: .75rem; align-self: start; }
  figure { margin: 0; position: relative; background: var(--soil); border-radius: 6px; overflow: hidden; aspect-ratio: 3 / 4; }
  figure button { all: unset; display: block; width: 100%; height: 100%; cursor: zoom-in; }
  figure button:focus-visible { outline: 3px solid var(--water); outline-offset: -3px; }
  figure img { width: 100%; height: 100%; object-fit: contain; display: block; }
  figcaption { position: absolute; left: .5rem; top: .5rem; background: rgba(31, 42, 30, .78); color: #fff; font-size: .8rem; padding: .1rem .5rem; border-radius: 3px; }
  .noimg { display: grid; place-items: center; height: 100%; padding: 1rem; text-align: center; color: var(--muted); }

  form.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 1.25rem; align-self: start; }
  fieldset { border: 0; padding: 0; margin: 0 0 1.3rem; }
  legend { font-weight: 600; padding: 0; margin-bottom: .45rem; }
  .hint { color: var(--muted); font-size: .85rem; margin: -.25rem 0 .5rem; }
  .opts { display: flex; flex-wrap: wrap; gap: .4rem; }
  .opts label { position: relative; }
  .opts input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .opts span { display: inline-block; padding: .5rem .95rem; border: 1.5px solid var(--line); border-radius: 999px; background: #fff; cursor: pointer; }
  .opts.rating span { border-radius: 6px; min-width: 2.8rem; text-align: center; }
  .opts input:checked + span { background: var(--water); border-color: var(--water); color: #fff; }
  .opts input:focus-visible + span { outline: 3px solid var(--paddy); outline-offset: 2px; }
  textarea, input[type=password], select { width: 100%; font: inherit; padding: .55rem .65rem; border: 1.5px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
  textarea { min-height: 4.5rem; resize: vertical; }
  textarea:focus, input:focus, select:focus { outline: 3px solid var(--water); outline-offset: 0; border-color: var(--water); }


  button.primary { font: inherit; font-weight: 600; border-radius: 6px; padding: .75rem 1.1rem; cursor: pointer; background: var(--paddy); color: #fff; border: 0; width: 100%; }
  button:disabled { opacity: .55; cursor: wait; }
  button:focus-visible { outline: 3px solid var(--water); outline-offset: 2px; }
  .msg { margin: .75rem 0 0; font-size: .9rem; min-height: 1.2em; }
  .msg.error { color: var(--warn); }
  .waiting { color: var(--muted); font-size: .9rem; margin: 0; }

  .center { max-width: 400px; margin: 12vh auto; padding: 0 1.25rem; }
  .center h2 { margin: 0 0 .5rem; font-size: 1.4rem; }
  .center p { color: var(--muted); margin: 0 0 1.25rem; }
  .center label { display: block; font-weight: 600; margin: 0 0 .3rem; }
  .center select, .center input { margin-bottom: 1rem; }

  dialog { border: 0; padding: 0; background: #000; max-width: 96vw; max-height: 96vh; }
  dialog::backdrop { background: rgba(0, 0, 0, .85); }
  dialog img { display: block; max-width: 96vw; max-height: 96vh; object-fit: contain; cursor: zoom-out; }
  @media (prefers-reduced-motion: reduce) { .bar div { transition: none; } }
</style>
</head>
<body>

<!-- Sign in -->
<section id="login" class="center" hidden>
  <h2>ISPC Plot photo backcheck - Kharif 2026</h2>
  <p>Choose your name and enter the access key your manager shared.</p>
  <form id="loginForm">
    <label for="name">Your name</label>
    <select id="name" required></select>
    <label for="key">Access key</label>
    <input id="key" type="password" required>
    <button class="primary" type="submit">Start reviewing</button>
    <p class="msg error" id="loginMsg"></p>
  </form>
</section>

<!-- Review -->
<div id="app" hidden>
  <header>
    <h1>ISPC Plot photo backcheck - Kharif 2026</h1>
    <div class="who"><span id="progress"></span> <span id="whoName"></span><button id="switch" type="button">Switch user</button><button id="finish" type="button">Finish and exit</button></div>
  </header>
  <div class="bar"><div id="barFill"></div></div>

  <main id="review">
    <div class="photos" id="photos"></div>
    <form id="qForm" class="panel" novalidate>
      <div id="part1"></div>
      <button class="primary" type="submit" id="saveBtn">Save and show next image</button>
      <p class="msg" id="msg" role="status"></p>
    </form>
  </main>

  <section id="status" class="center" hidden>
    <h2 id="statusTitle"></h2>
    <p id="statusText"></p>
    <button class="primary" type="button" id="retry">Check again</button>
  </section>
</div>

<!-- Session finished -->
<section id="ended" class="center" hidden>
  <h2>Session finished</h2>
  <p id="endedText">Your answers are saved. You can close this tab now.</p>
  <button class="primary" type="button" id="restart">Start again</button>
</section>

<dialog id="zoom"><img alt=""></dialog>

<script>
/* ======================= CONFIG ======================= */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbx2wLapmNxm9AE2bWrjTQHZqt5zuKbglbkpH5EilvgOTXq8LS3AQOHVnNQG1up8tQq-2w/exec',   // ends in /exec

  BACKCHECKERS: ['Chaitra', 'Nikhila', 'Supraja', 'Nayan', 'Nick Ryan', 'Naveen', 'Steven', 'Kiran', 'Others'],  // names in the dropdown

  IMAGE_LABELS: ['Plot photo'],   // same order as IMAGE_COLS in Code.gs

  // "col" must match the sheet header exactly (extra spaces and capitals are ignored).
  // image: 1 or 2 means the question is skipped, and NA_VALUE recorded, when that photo is blank.
  // optional: true lets the backchecker leave it empty.
  QUESTIONS: [
    { col: 'bc_In this image is there standing water across the plot?', label: 'In this image is there standing water across the plot?',
      type: 'choice', options: ['Yes', 'No', 'Partially Flooded (puddles)', 'Plot is looking wet/mushy but no standing water', 'Image not clear'], image: 1 },
  ],

  NA_VALUE: 'NA',

  // While the backchecker answers, the next plot loads in the background. A preloaded plot
  // older than this is discarded, so its reservation (15 min in Code.gs) can't run out.
  PRELOAD_MAX_AGE_MIN: 10,

  MIN_SERVER_VERSION: 4,   // must match VERSION in Code.gs
};
/* ====================================================== */

const $ = id => document.getElementById(id);
const store = {
  get: k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
const S = { by: store.get('bc_by'), key: store.get('bc_key'), item: null, busy: false };

/* ---------- API ---------- */
async function apiGet(params) {
  const u = new URL(CONFIG.API_URL);
  Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
  return (await fetch(u)).json();
}
async function apiPost(body) {
  // text/plain avoids a CORS preflight, which Apps Script can't answer
  const r = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return r.json();
}

/* ---------- Questions ---------- */
function questionHTML(q, label) {
  const hint = q.hint ? `<p class="hint">${q.hint}</p>` : '';
  const id = 'q' + Math.abs([...q.col].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7));
  if (q.type === 'text') {
    return `<fieldset data-col="${q.col}"><legend><label for="${id}">${label}</label></legend>${hint}<textarea id="${id}" name="${q.col}"></textarea></fieldset>`;
  }
  const opts = q.type === 'rating' ? Array.from({ length: q.max || 5 }, (_, n) => String(n + 1)) : q.options;
  return `<fieldset data-col="${q.col}"><legend>${label}</legend>${hint}<div class="opts${q.type === 'rating' ? ' rating' : ''}">` +
    opts.map(o => `<label><input type="radio" name="${q.col}" value="${o}"><span>${o}</span></label>`).join('') +
    `</div></fieldset>`;
}

// A question applies unless it depends on a photo that is blank for this observation
function applies(q) {
  if (!q.image || !S.item) return true;
  const img = S.item.images[q.image - 1];
  return img && img.status !== 'missing';
}

function valueOf(q) {
  const fd = new FormData($('qForm'));
  return (fd.get(q.col) || '').toString().trim();
}


/* ---------- Rendering ---------- */
function renderItem(it) {
  $('status').hidden = true; $('review').hidden = false;

  // Photos: only the ones that exist for this observation
  const shown = it.images.map((img, i) => ({ ...img, i })).filter(img => img.status !== 'missing');
  $('photos').innerHTML = !shown.length
    ? '<figure><div class="noimg">This observation has no plot photo in the sheet. Click Save to record NA and move on.</div></figure>'
    : shown.map(img => `<figure>
        ${img.status === 'ok'
          ? `<button type="button" data-i="${img.i}" aria-label="Enlarge ${CONFIG.IMAGE_LABELS[img.i]}"><img src="${img.src}" alt="${CONFIG.IMAGE_LABELS[img.i]}" onerror="this.parentNode.outerHTML='<div class=&quot;noimg&quot;>${CONFIG.IMAGE_LABELS[img.i]} couldn&#39;t be loaded. Choose Image not clear.</div>'"></button>`
          : `<div class="noimg">${CONFIG.IMAGE_LABELS[img.i]} couldn't be loaded. Choose Image not clear.</div>`}
        <figcaption>${CONFIG.IMAGE_LABELS[img.i]}</figcaption></figure>`).join('');

  $('part1').innerHTML = CONFIG.QUESTIONS.filter(applies).map(q => questionHTML(q, q.label)).join('');
  setMsg('');
  window.scrollTo({ top: 0 });
}

function renderProgress(p) {
  if (!p) return;
  $('progress').textContent = `${p.done} of ${p.total} plots reviewed.`;
  $('barFill').style.width = p.total ? (100 * p.done / p.total) + '%' : '0';
}

function setMsg(text, error = false) { $('msg').textContent = text; $('msg').className = 'msg' + (error ? ' error' : ''); }
function setBusy(b) { S.busy = b; $('saveBtn').disabled = b; }

function showStatus(title, text) {
  $('review').hidden = true; $('status').hidden = false;
  $('statusTitle').textContent = title; $('statusText').textContent = text;
}

/* ---------- Flow ---------- */
// Show a response from the 'next' action, then start preloading the one after it
function showResult(res) {
  if (res.error) {
    if (/access key/i.test(res.error)) return signOut(res.error);
    return showStatus('Could not load a plot', res.error);
  }
  if (!(res.v >= CONFIG.MIN_SERVER_VERSION)) {
    return showStatus('The Apps Script needs updating',
      'The live Apps Script is an older version than this page. In Apps Script, go to Deploy > Manage deployments, edit the deployment, choose "New version" and click Deploy. Check that API_URL in index.html is that deployment\'s URL.');
  }
  renderProgress(res.progress);
  if (res.finished) return showStatus('All plots are reviewed', 'There are no plots left to check right now. New rows added to the sheet will appear here.');
  S.item = res;
  renderItem(res);
  S.preload = { t: Date.now(), p: apiGet({ action: 'next', key: S.key, by: S.by, skip: res.rowKey })
    .then(nx => {   // also warm the browser cache for photos that are plain links
      (nx && nx.images || []).forEach(im => { if (im.src && /^https?:/.test(im.src)) new Image().src = im.src; });
      return nx;
    })
    .catch(() => null) };
}

// After saving: use the preloaded plot if it's ready and recent, otherwise load normally
async function showNext() {
  const pl = S.preload;
  S.preload = null;
  if (pl && Date.now() - pl.t < CONFIG.PRELOAD_MAX_AGE_MIN * 60000) {
    setMsg('Loading the next plot…');
    const res = await pl.p;
    if (res && !res.error && res.rowKey !== (S.item && S.item.rowKey)) {   // never show the same plot twice
      if (res.progress) res.progress.done++;   // counted before this save
      setBusy(false);
      return showResult(res);
    }
  }
  return loadNext();
}

async function loadNext() {
  S.preload = null;
  setBusy(true);
  $('review').hidden = false; $('status').hidden = true;
  $('part1').innerHTML = '';
  $('photos').innerHTML = '<figure><div class="noimg">Loading photo…</div></figure>';
  setMsg('Loading the next plot…');
  try {
    showResult(await apiGet({ action: 'next', key: S.key, by: S.by }));
  } catch (e) {
    showStatus('Could not reach the sheet', 'Check your internet connection, then try again.');
  } finally {
    setBusy(false);
  }
}

async function submit() {
  if (S.busy || !S.item) return;
  const answers = {}, missing = [];
  CONFIG.QUESTIONS.forEach(q => {
    if (!applies(q)) { answers[q.col] = CONFIG.NA_VALUE; return; }
    let v = valueOf(q);
    if (!v && !q.optional) missing.push(q.label);
    if (q.type === 'rating' && v) v = Number(v);
    answers[q.col] = v;
  });
  if (missing.length) return setMsg('Answer the question to see the next image.', true);

  setBusy(true);
  setMsg('Saving…');
  try {
    const res = await apiPost({ key: S.key, by: S.by, row: S.item.row, rowKey: S.item.rowKey, answers });
    if (res.error && !res.skip) { setBusy(false); return setMsg(res.error + ' Your answers are still here; try again.', true); }
    await showNext();
    if (res.error) setMsg(res.error, true);
  } catch (e) {
    setBusy(false);
    setMsg('Could not save. Check your connection; your answers are still here.', true);
  }
}

// Hand back any plots this person has reserved (current + preloaded), so others can take them now
async function releaseClaims() {
  if (S.preload) { try { await S.preload.p; } catch {} }   // let a pending preload finish first
  S.preload = null; S.item = null;
  try { await apiPost({ key: S.key, by: S.by, action: 'release' }); } catch {}
}

function hasUnsavedAnswers() {
  if (!S.item || $('review').hidden) return false;
  return [...new FormData($('qForm')).values()].some(v => String(v).trim());
}

async function finish() {
  if (hasUnsavedAnswers() && !confirm("Your answers for this plot haven't been saved. Finish anyway?")) return;
  $('finish').disabled = true; $('switch').disabled = true;
  setMsg('Finishing…');
  await releaseClaims();
  $('finish').disabled = false; $('switch').disabled = false;
  $('app').hidden = true; $('ended').hidden = false;
  window.close();   // only works if the browser allows it; otherwise the screen above stays
}

function signOut(reason = '') {
  S.key = ''; store.set('bc_key', '');
  $('app').hidden = true; $('login').hidden = false;
  $('name').value = CONFIG.BACKCHECKERS.includes(S.by) ? S.by : '';
  $('loginMsg').textContent = reason;
}

function start() {
  $('login').hidden = true; $('app').hidden = false;
  $('whoName').textContent = 'Signed in as ' + S.by + '.';
  loadNext();
}

/* ---------- Events ---------- */
$('name').innerHTML = '<option value="">Select your name</option>' +
  CONFIG.BACKCHECKERS.map(n => `<option>${n}</option>`).join('');

$('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  const by = $('name').value, key = $('key').value.trim();
  if (!by) return ($('loginMsg').textContent = 'Choose your name from the list.');
  if (!key) return ($('loginMsg').textContent = 'Enter the access key.');
  S.by = by; S.key = key;
  store.set('bc_by', by); store.set('bc_key', key);
  start();
});
$('qForm').addEventListener('submit', e => { e.preventDefault(); submit(); });
$('retry').addEventListener('click', loadNext);
$('switch').addEventListener('click', async () => {
  if (hasUnsavedAnswers() && !confirm("Your answers for this plot haven't been saved. Switch user anyway?")) return;
  await releaseClaims();
  signOut();
});
$('finish').addEventListener('click', finish);
$('restart').addEventListener('click', () => { $('ended').hidden = true; start(); });
$('photos').addEventListener('click', e => {
  const b = e.target.closest('button[data-i]');
  if (!b) return;
  const d = $('zoom'); d.querySelector('img').src = S.item.images[b.dataset.i].src; d.showModal();
});
$('zoom').addEventListener('click', () => $('zoom').close());

if (S.by && S.key && CONFIG.BACKCHECKERS.includes(S.by)) start(); else signOut();
</script>
</body>
</html>
